# Checks every push: runs each app's logic tests and builds the app for the
# iPhone Simulator. Builds are unsigned, so no Apple account or keys are
# needed here. Signing and uploading happen on the Mac with scripts/ship.sh.
#
# Each job leaves a "report-<App>" artifact with errors.txt (one line per
# compiler error, with repo-relative paths) and the full logs.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: OMM
            kit: OMMKit
          - app: DoThisNow
            kit: DoThisNowKit
          - app: MutualSwipe
            kit: MutualKit
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Logic tests
        id: tests
        continue-on-error: true
        run: |
          cd "${{ matrix.app }}/Packages/${{ matrix.kit }}"
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build the app (Simulator, unsigned)
        id: build
        continue-on-error: true
        run: |
          xcodebuild \
            -project "${{ matrix.app }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect errors
        if: always()
        run: bash scripts/ci-report.sh "${{ matrix.app }}" "${{ steps.tests.outcome }}" "${{ steps.build.outcome }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.app }}
          path: report/
          retention-days: 14

      - name: Fail the job if tests or the build failed
        if: steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
