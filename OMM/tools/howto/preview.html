<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMM How-To Preview</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #f5f6fb; color: #2d3748; margin: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 6px 16px rgba(30,20,80,.12); }
  canvas { width: 100%; aspect-ratio: 200 / 140; display: block; }
  h3 { margin: 6px 0; font-size: 15px; }
  ol { margin: 0; padding-left: 18px; font-size: 13px; color: #718096; }
</style>
</head>
<body>
<p>Same drawing rules as <code>OMM/OMM/HowTo/HowToView.swift</code> and <code>OMMKit/HowTo.swift</code>. Edit <code>moves.js</code>, reload, then run <code>node OMM/tools/howto/generate.js</code>. Add <code>?sheet=</code> to see every key pose.</p>
<div class="grid" id="grid"></div>
<script src="moves.js"></script>
<script>
const FLOOR = 124, NECK = 3, HEAD = 8, UA = 21, FA = 20, TH = 26, SN = 25;
const NEAR = "#2D3748", FAR = "#A0AEC0", PROP = "#667EEA", PROPFILL = "#E3E8FB", FLOORC = "#CBD5E0";

const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = a => Math.hypot(a[0], a[1]);
const unit = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const rot = (v, rad) => [v[0] * Math.cos(rad) - v[1] * Math.sin(rad), v[0] * Math.sin(rad) + v[1] * Math.cos(rad)];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

function limb(root, target, a, b, bend) {
  const v = sub(target, root), d = len(v), dir = unit(v);
  if (d >= a + b) return { joint: add(root, mul(dir, a)), end: add(root, mul(dir, a + b)) };
  const dd = Math.max(d, Math.abs(a - b) + 0.01);
  const cos = Math.min(1, Math.max(-1, (a * a + dd * dd - b * b) / (2 * a * dd)));
  const joint = add(root, mul(rot(dir, bend * Math.acos(cos)), a));
  return { joint, end: add(root, mul(dir, dd)) };
}

function full(p) {
  return { hip: p.hip, sh: p.sh, nh: p.nh, fh: p.fh, nf: p.nf, ff: p.ff,
           sw: p.sw || [0, 0], hw: p.hw || [0, 0], ht: p.ht || 0, hideBody: !!p.hideBody };
}
function mix(a, b, t) {
  const o = {};
  for (const k of ["hip", "sh", "nh", "fh", "nf", "ff", "sw", "hw"]) o[k] = lerp(a[k], b[k], t);
  o.ht = a.ht + (b.ht - a.ht) * t; o.hideBody = a.hideBody;
  return o;
}
function poseAt(m, time) {
  const fp = new URLSearchParams(location.search).get("f");
  if (fp !== null) return full(m.frames[Math.min(Number(fp), m.frames.length - 1)].p);
  const total = m.frames.reduce((s, f) => s + f.hold + f.go, 0);
  let t = time % total;
  for (let i = 0; i < m.frames.length; i++) {
    const f = m.frames[i];
    const a = full(f.p);
    if (t < f.hold) return a;
    t -= f.hold;
    if (t < f.go) {
      const u = t / f.go, e = u * u * (3 - 2 * u);
      return mix(a, full(m.frames[(i + 1) % m.frames.length].p), e);
    }
    t -= f.go;
  }
  return full(m.frames[0].p);
}

function solve(m, p) {
  const [na, fa, nl, fl] = m.bends;
  const nArm = limb(add(p.sh, p.sw), p.nh, UA, FA, na);
  const fArm = limb(sub(p.sh, p.sw), p.fh, UA, FA, fa);
  const nLeg = limb(add(p.hip, p.hw), p.nf, TH, SN, nl);
  const fLeg = limb(sub(p.hip, p.hw), p.ff, TH, SN, fl);
  const dir = rot(unit(sub(p.sh, p.hip)), p.ht * Math.PI / 180);
  const head = add(p.sh, mul(dir, NECK + HEAD));
  return { p, nArm, fArm, nLeg, fLeg, head };
}

function draw(ctx, m, time) {
  const s = solve(m, poseAt(m, time)), p = s.p;
  const front = m.view === "front";
  const farColor = front ? NEAR : FAR;
  ctx.clearRect(0, 0, 200, 140);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const line = (pts, c, w) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...pts[0]); for (const q of pts.slice(1)) ctx.lineTo(...q); ctx.stroke(); };
  const circle = (c, r, fill, stroke, w) => { ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.stroke(); } };
  const rect = (x, y, w, h) => { ctx.fillStyle = PROP; ctx.beginPath(); ctx.roundRect(x, y, w, h, 2); ctx.fill(); };
  const handOf = which => which === "f" ? s.fArm.end : s.nArm.end;
  const props = m.props || [];

  line([[6, FLOOR], [194, FLOOR]], FLOORC, 2);
  for (const pr of props) {
    if (pr.k === "bench") { rect(pr.x, pr.y, pr.w, 5); line([[pr.x + 6, pr.y + 5], [pr.x + 6, FLOOR]], PROP, 3); line([[pr.x + pr.w - 6, pr.y + 5], [pr.x + pr.w - 6, FLOOR]], PROP, 3); }
    if (pr.k === "seat") { rect(pr.x, pr.y, pr.w, 5); rect(pr.x - 5, pr.back, 5, pr.y + 5 - pr.back); line([[pr.x + pr.w / 2, pr.y + 5], [pr.x + pr.w / 2, FLOOR]], PROP, 3); }
    if (pr.k === "tower") { line([[pr.x, FLOOR], [pr.x, pr.top - 8]], PROP, 4); circle([pr.x, pr.top], 4, PROPFILL, PROP, 2); }
    if (pr.k === "cable") line([pr.from, handOf(pr.hand)], PROP, 1.5);
    if (pr.k === "lever") line([[pr.post, FLOOR], [pr.post, pr.pivot[1]], pr.pivot], PROP, 4);
  }
  const limbLine = (L, root, c, w) => line([root, L.joint, L.end], c, w);
  if (!p.hideBody) limbLine(s.fLeg, sub(p.hip, p.hw), farColor, 5);
  if (props.some(x => x.k === "dumbbells") && !front) rect(s.fArm.end[0] - 7, s.fArm.end[1] - 3.5, 14, 7);
  limbLine(s.fArm, sub(p.sh, p.sw), farColor, 5);
  if (front) line([sub(p.sh, p.sw), add(p.sh, p.sw)], NEAR, 5);
  if (front && !p.hideBody) line([sub(p.hip, p.hw), add(p.hip, p.hw)], NEAR, 5);
  if (!p.hideBody) line([p.hip, p.sh], NEAR, 6);
  if (!p.hideBody) limbLine(s.nLeg, add(p.hip, p.hw), NEAR, 5);
  circle(s.head, HEAD, NEAR);
  for (const pr of props) if (pr.k === "lever") { line([pr.pivot, s.nArm.end], PROP, 4); circle(pr.pivot, 4, PROPFILL, PROP, 2); }
  limbLine(s.nArm, add(p.sh, p.sw), NEAR, 5);
  for (const pr of props) {
    if (pr.k === "barbell") { circle(s.nArm.end, 11, PROPFILL, PROP, 3); circle(s.nArm.end, 2.5, PROP); }
    if (pr.k === "dumbbells") {
      if (front) { circle(s.nArm.end, 5, PROP); circle(s.fArm.end, 5, PROP); }
      else rect(s.nArm.end[0] - 7, s.nArm.end[1] - 3.5, 14, 7);
    }
    if (pr.k === "squeeze") {
      const c = lerp(s.nArm.end, s.fArm.end, 0.5);
      line([[c[0] - 16, c[1] - 4], [c[0] - 11, c[1]], [c[0] - 16, c[1] + 4]], PROP, 2);
      line([[c[0] + 16, c[1] - 4], [c[0] + 11, c[1]], [c[0] + 16, c[1] + 4]], PROP, 2);
    }
  }
}

const grid = document.getElementById("grid"), items = [];
const sheetParams = new URLSearchParams(location.search);
if (sheetParams.has("sheet")) {
  // Every frame of every move side by side, for checking poses.
  grid.style.gridTemplateColumns = "repeat(" + (sheetParams.get("cols") || 4) + ", 1fr)";
  const pick = sheetParams.get("sheet");
  HOWTO.moves.forEach((m, mi) => {
    if (pick !== "" && !pick.split(",").includes(String(mi))) return;
    for (let fi = 0; fi < 4; fi++) {
      const card = document.createElement("div"); card.className = "card";
      grid.appendChild(card);
      if (fi >= m.frames.length) continue;
      const c = document.createElement("canvas"); c.width = 600; c.height = 420; card.appendChild(c);
      card.insertAdjacentHTML("beforeend", "<h3>" + m.name + " #" + fi + "</h3>");
      const ctx = c.getContext("2d"); ctx.scale(3, 3);
      const t = m.frames.slice(0, fi).reduce((s, f) => s + f.hold + f.go, 0);
      draw(ctx, m, t);
    }
  });
  throw new Error("sheet done");
}
for (const m of HOWTO.moves) {
  const card = document.createElement("div"); card.className = "card";
  const c = document.createElement("canvas"); c.width = 600; c.height = 420;
  card.appendChild(c);
  card.insertAdjacentHTML("beforeend", `<h3>${m.name}</h3><ol>${m.tips.map(t => `<li>${t}</li>`).join("")}</ol>`);
  grid.appendChild(card);
  const ctx = c.getContext("2d"); ctx.scale(3, 3);
  items.push({ ctx, m });
}
const params = new URLSearchParams(location.search);
const still = params.has("t") ? Number(params.get("t")) : null;
function frame(ms) { for (const it of items) draw(it.ctx, it.m, still ?? ms / 1000); if (still === null) requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
